
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Conecte-se!</h1>
        <p>Tecnologia, criatividade e inovação.</p>
    </header>

    <main>

        <section class="apresentacao">
            <h2 id="titulo">Bem-vindo ao nosso projeto!</h2>

            <p id="mensagem">
                Este é um site desenvolvido por jovens
                que estão aprendendo Web Design.
            </p>

            <button id="botaoTexto">
                Alterar mensagem
            </button>
        </section>

        <section class="interacao">
            <h2>Vamos interagir?</h2>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
            >

            <button id="botaoNome">
                Enviar nome
            </button>

            <p id="resultado"></p>
        </section>

        <section class="curtidas">
            <h2>Você gostou do projeto?</h2>

            <p id="contador">0 curtidas</p>

            <button id="botaoCurtir">
                Curtir
            </button>
        </section>

        <section class="aparencia">
            <h2>Personalize a página</h2>

            <button id="botaoCor">
                Mudar cor de fundo
            </button>
        </section>

    </main>

    <footer>
        <p>Desenvolvido pelos jovens de Web Design.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
